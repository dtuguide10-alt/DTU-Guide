<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>DTU Guide</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f5f6f7; color: #17202a;
        font-family: system-ui, -apple-system, sans-serif; display: grid; place-items: center; text-align: center; }
      .box { padding: 24px; }
      h1 { font-size: 18px; margin: 0 0 6px; }
      p { font-size: 13px; color: #5f6b76; margin: 0; }
      .dot { width: 8px; height: 8px; background: #356fa8; display: inline-block; margin: 12px 3px 0; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>DTU Guide</h1>
      <p>Connecting…</p>
      <div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
      <p style="margin-top:14px">If this doesn't load, check your internet connection.</p>
    </div>
  </body>
</html>
